<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neonGreenIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="silverWhiteIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="100" height="100" rx="22" fill="#0b0f17" stroke="#1e293b" stroke-width="2" />

  <!-- Knight Body & Mane (Silver) -->
  <g transform="translate(6, 4)">
    <path d="M 32 66 C 32 55 38 47 40 41 C 34 39 25 35 21 28 C 18 23 19 19 23 18 C 28 17 32 20 36 23 C 37 18 43 12 50 11 C 51 14 50 18 47 21 C 54 23 60 28 62 36" 
          stroke="url(#silverWhiteIcon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Knight Snout & Eye -->
    <path d="M 21 28 C 24 32 31 34 36 32" stroke="url(#silverWhiteIcon)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="31" cy="24" r="2.2" fill="#ffffff" />

    <!-- Knight Base -->
    <path d="M 27 66 L 63 66" stroke="url(#silverWhiteIcon)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 22 74 L 68 74" stroke="url(#silverWhiteIcon)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Glowing Green Curly Bracket Code Accent -->
    <path d="M 64 14 C 74 22 72 32 82 39 C 72 45 74 58 64 66" 
          stroke="url(#neonGreenIcon)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#iconGlow)" />
  </g>
</svg>
