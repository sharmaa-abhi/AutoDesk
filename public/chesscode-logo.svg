<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="silverWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Chess Knight + Code Bracket Icon -->
  <g transform="translate(15, 10)">
    <!-- Knight Body & Mane (Silver) -->
    <path d="M 28 64 C 28 54 34 46 36 40 C 30 38 21 34 18 28 C 15 23 16 19 20 18 C 24 17 28 20 32 23 C 33 18 38 12 44 11 C 45 14 44 18 41 21 C 48 23 54 28 56 35" 
          stroke="url(#silverWhite)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Knight Snout & Jaw Detail -->
    <path d="M 18 28 C 21 32 27 34 32 32" stroke="url(#silverWhite)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="27" cy="24" r="2" fill="#ffffff" />

    <!-- Knight Base -->
    <path d="M 24 64 L 56 64" stroke="url(#silverWhite)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 20 72 L 60 72" stroke="url(#silverWhite)" stroke-width="4.5" stroke-linecap="round" />

    <!-- Glowing Green Curly Bracket Code Accent -->
    <path d="M 58 14 C 67 22 65 32 74 38 C 65 44 67 56 58 64" 
          stroke="url(#neonGreen)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)" />
  </g>

  <!-- Typography: ChessCode -->
  <g transform="translate(115, 63)">
    <text font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="44" letter-spacing="-0.5">
      <tspan fill="#ffffff">Chess</tspan>
      <tspan fill="url(#neonGreen)" filter="url(#glow)">Code</tspan>
    </text>
  </g>
</svg>
